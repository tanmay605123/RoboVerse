# RoboVerse Supabase Local Configuration
project_id = "roboverse-core"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_role = "anon"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
port = 54328
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54330


[functions.rituu-chat]
verify_jwt = true

[functions.nearby-shops]
verify_jwt = false

[functions.payments-create]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false
