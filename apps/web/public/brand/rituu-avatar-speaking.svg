<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="rituuHeadS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143628" />
      <stop offset="50%" stop-color="#091E16" />
      <stop offset="100%" stop-color="#05100B" />
    </linearGradient>
    <linearGradient id="rituuVisorS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020805" />
      <stop offset="100%" stop-color="#051810" />
    </linearGradient>
    <filter id="eyeGlowS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <line x1="100" y1="45" x2="100" y2="22" stroke="#7FE7D6" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="18" r="8" fill="#39FF6A" filter="url(#eyeGlowS)" />
  <circle cx="100" cy="18" r="3" fill="#FFFFFF" />

  <rect x="24" y="85" width="12" height="36" rx="6" fill="#092218" stroke="#39FF6A" stroke-width="2" />
  <rect x="164" y="85" width="12" height="36" rx="6" fill="#092218" stroke="#39FF6A" stroke-width="2" />

  <rect x="34" y="42" width="132" height="120" rx="36" fill="url(#rituuHeadS)" stroke="#39FF6A" stroke-width="2.5" />
  <rect x="46" y="58" width="108" height="74" rx="22" fill="url(#rituuVisorS)" stroke="#7FE7D6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Expressive Happy Eyes -->
  <path d="M 64 90 Q 76 74 88 90" fill="none" stroke="#39FF6A" stroke-width="5" stroke-linecap="round" filter="url(#eyeGlowS)" />
  <path d="M 112 90 Q 124 74 136 90" fill="none" stroke="#39FF6A" stroke-width="5" stroke-linecap="round" filter="url(#eyeGlowS)" />

  <!-- Speaking Dynamic Waveform Mouth -->
  <path d="M 82 120 Q 90 128 100 120 T 118 120" fill="none" stroke="#7FE7D6" stroke-width="3" stroke-linecap="round" filter="url(#eyeGlowS)" />
  <path d="M 88 124 Q 100 134 112 124" fill="none" stroke="#39FF6A" stroke-width="3" stroke-linecap="round" filter="url(#eyeGlowS)" />
</svg>
