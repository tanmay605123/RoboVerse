<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E2A1F" />
      <stop offset="100%" stop-color="#07110D" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Pulse Glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF6A" stop-opacity="1" />
      <stop offset="50%" stop-color="#39FF6A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#39FF6A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="40" fill="url(#bgGrad)" stroke="#39FF6A" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Background Circuit Traces (Subtle) -->
  <path d="M 20 60 H 45 L 60 75" fill="none" stroke="#39FF6A" stroke-width="1.5" stroke-opacity="0.2" />
  <path d="M 180 60 H 155 L 140 75" fill="none" stroke="#7FE7D6" stroke-width="1.5" stroke-opacity="0.2" />
  <path d="M 20 140 H 45 L 60 125" fill="none" stroke="#7FE7D6" stroke-width="1.5" stroke-opacity="0.2" />
  <path d="M 180 140 H 155 L 140 125" fill="none" stroke="#39FF6A" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Outer Hexagonal Chip / Robot Head Perimeter -->
  <polygon points="100,28 162,64 162,136 100,172 38,136 38,64" 
           fill="#091A14" 
           stroke="#7FE7D6" 
           stroke-width="2" 
           stroke-opacity="0.6" />

  <!-- Inner Hexagon Frame -->
  <polygon points="100,38 152,68 152,132 100,162 48,132 48,68" 
           fill="#05120C" 
           stroke="#39FF6A" 
           stroke-width="3" 
           filter="url(#neonGlow)" />

  <!-- Robot Head Ears / Chip Contact Pads -->
  <rect x="28" y="85" width="8" height="30" rx="3" fill="#39FF6A" opacity="0.8" />
  <rect x="164" y="85" width="8" height="30" rx="3" fill="#39FF6A" opacity="0.8" />
  
  <rect x="75" y="20" width="10" height="6" rx="2" fill="#7FE7D6" opacity="0.8" />
  <rect x="115" y="20" width="10" height="6" rx="2" fill="#7FE7D6" opacity="0.8" />

  <!-- Central Circuit Trace forming a Lightning Bolt -->
  <path d="M 108 48 L 74 102 L 102 102 L 88 152 L 132 94 L 106 94 Z" 
        fill="#39FF6A" 
        stroke="#FFFFFF" 
        stroke-width="1"
        filter="url(#neonGlow)" />

  <!-- Glowing Neon-Green Node at Key Junction -->
  <circle cx="102" cy="102" r="14" fill="url(#nodeGlow)" />
  <circle cx="102" cy="102" r="4.5" fill="#FFFFFF" />

  <!-- Secondary Teal Sensor Node -->
  <circle cx="100" cy="40" r="3" fill="#7FE7D6" />
</svg>
