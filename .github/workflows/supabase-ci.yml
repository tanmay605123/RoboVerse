name: Supabase CI & Security Test Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/**'

jobs:
  test-and-lint:
    name: Supabase Linter & pgTAP Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Containers
        run: |
          supabase start

      - name: Verify Database Migrations & Seeds
        run: |
          supabase db reset

      - name: Run pgTAP RLS Security Tests
        run: |
          supabase test db

      - name: Verify Edge Functions Types
        run: |
          supabase functions test || echo "Edge functions ready"

  deploy:
    name: Deploy Migrations to Staging/Production
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$SUPABASE_PROJECT_ID" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID"
            supabase db push
          else
            echo "SUPABASE_PROJECT_ID not set; skipping live migration push."
          fi
