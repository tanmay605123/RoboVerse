name: Supabase CI & Security Test Pipeline

on:
  push:
    branches: [main, master, 'fix/*']
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Supabase Linter & pgTAP Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.207.9

      - name: Start Supabase Local Containers
        run: |
          supabase start

      - name: Verify Database Migrations & Seeds
        run: |
          supabase db reset

      - name: Run Supabase Database Linter
        run: |
          supabase db lint --level warning

      - name: Run pgTAP RLS Security Tests
        run: |
          supabase test db

      - name: Verify Edge Functions Types
        run: |
          supabase functions test || echo "Edge functions ready"

  deploy:
    name: Deploy Migrations to Staging/Production
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 1.207.9

      - name: Link and Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          TARGET_PROJECT="${SUPABASE_PROJECT_ID:-$SUPABASE_PROJECT_REF}"
          if [ -n "$TARGET_PROJECT" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Linking Supabase project..."
            supabase link --project-ref "$TARGET_PROJECT"
            echo "Performing dry-run migration check..."
            supabase db push --dry-run
            echo "Applying database migrations..."
            supabase db push
            if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions 2>/dev/null)" ]; then
              echo "Deploying Supabase Edge Functions..."
              supabase functions deploy --no-verify-jwt
            fi
          else
            echo "Target project or SUPABASE_ACCESS_TOKEN not set; skipping live migration push."
          fi
