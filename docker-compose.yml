version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: roboverse_redis
    ports:
      - '6379:6379'
    volumes:
      - roboverse_redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: roboverse_api
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      CLIENT_WEB_URL: http://localhost:3000
      CLIENT_MOBILE_URL: http://localhost:8081
      JWT_ACCESS_SECRET: roboverse_super_secret_access_jwt_key_2026_xyz
      JWT_REFRESH_SECRET: roboverse_super_secret_refresh_jwt_key_2026_abc
      RAZORPAY_KEY_ID: rzp_test_RoboVerseMockKey2026
      RAZORPAY_KEY_SECRET: mock_razorpay_secret_key_998877
      RAZORPAY_WEBHOOK_SECRET: mock_razorpay_webhook_secret_112233
      GEMINI_API_KEY: mock_gemini_api_key_2026
      GEMINI_MODEL: gemini-1.5-flash
      GEMINI_MODEL_PRO: gemini-1.5-pro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: roboverse_worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  roboverse_redisdata:
