<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="rituuHeadT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143628" />
      <stop offset="50%" stop-color="#091E16" />
      <stop offset="100%" stop-color="#05100B" />
    </linearGradient>
    <linearGradient id="rituuVisorT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020805" />
      <stop offset="100%" stop-color="#051810" />
    </linearGradient>
    <filter id="eyeGlowT" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Antenna Pulsing (Yellow/Orange Alert Pulse for Thinking) -->
  <line x1="100" y1="45" x2="100" y2="20" stroke="#FF9A1F" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="16" r="9" fill="#FF9A1F" filter="url(#eyeGlowT)" />
  <circle cx="100" cy="16" r="3" fill="#FFFFFF" />

  <rect x="24" y="85" width="12" height="36" rx="6" fill="#092218" stroke="#39FF6A" stroke-width="2" />
  <rect x="164" y="85" width="12" height="36" rx="6" fill="#092218" stroke="#39FF6A" stroke-width="2" />

  <rect x="34" y="42" width="132" height="120" rx="36" fill="url(#rituuHeadT)" stroke="#39FF6A" stroke-width="2.5" />
  <rect x="46" y="58" width="108" height="74" rx="22" fill="url(#rituuVisorT)" stroke="#7FE7D6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Thinking Eyes (One arch, one wide scanning radar) -->
  <path d="M 64 92 Q 76 80 88 92" fill="none" stroke="#39FF6A" stroke-width="4.5" stroke-linecap="round" filter="url(#eyeGlowT)" />
  <ellipse cx="124" cy="90" rx="14" ry="16" fill="#39FF6A" filter="url(#eyeGlowT)" />
  <circle cx="120" cy="85" r="4" fill="#FFFFFF" />

  <!-- Thinking Processing Dots -->
  <circle cx="92" cy="122" r="3" fill="#7FE7D6" />
  <circle cx="100" cy="122" r="3" fill="#39FF6A" />
  <circle cx="108" cy="122" r="3" fill="#FF9A1F" />
</svg>
