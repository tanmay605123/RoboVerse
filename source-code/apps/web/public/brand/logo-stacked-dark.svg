<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="glowS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="nodeGlowS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF6A" stop-opacity="1" />
      <stop offset="100%" stop-color="#39FF6A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Emblem Centered -->
  <g transform="translate(60, 20) scale(0.6)">
    <rect width="200" height="200" rx="40" fill="#07110D" stroke="#39FF6A" stroke-width="3" stroke-opacity="0.5" />
    <polygon points="100,28 162,64 162,136 100,172 38,136 38,64" fill="#091A14" stroke="#7FE7D6" stroke-width="3" />
    <polygon points="100,38 152,68 152,132 100,162 48,132 48,68" fill="#05120C" stroke="#39FF6A" stroke-width="4" filter="url(#glowS)" />
    <!-- Connector pins -->
    <rect x="26" y="85" width="10" height="30" rx="3" fill="#39FF6A" />
    <rect x="164" y="85" width="10" height="30" rx="3" fill="#39FF6A" />
    <!-- Lightning bolt -->
    <path d="M 108 48 L 74 102 L 102 102 L 88 152 L 132 94 L 106 94 Z" fill="#39FF6A" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glowS)" />
    <circle cx="102" cy="102" r="14" fill="url(#nodeGlowS)" />
    <circle cx="102" cy="102" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text x="120" y="180" text-anchor="middle" font-family="'Sora', 'Manrope', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="2">
    <tspan fill="#F0FFF5">ROBO</tspan>
    <tspan fill="#39FF6A" filter="url(#glowS)">VERSE</tspan>
  </text>

  <!-- Tagline -->
  <text x="120" y="205" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#7FE7D6" letter-spacing="2.5">
    LEARN IT. BUILD IT. SIMULATE IT.
  </text>
</svg>
