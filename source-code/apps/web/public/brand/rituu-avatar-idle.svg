<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Metallic Robot Head Gradient -->
    <linearGradient id="rituuHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143628" />
      <stop offset="50%" stop-color="#091E16" />
      <stop offset="100%" stop-color="#05100B" />
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="rituuVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020805" />
      <stop offset="100%" stop-color="#051810" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Antenna -->
  <line x1="100" y1="45" x2="100" y2="22" stroke="#7FE7D6" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="18" r="8" fill="#39FF6A" filter="url(#eyeGlow)" />
  <circle cx="100" cy="18" r="3" fill="#FFFFFF" />

  <!-- Ear Audio Receivers -->
  <rect x="24" y="85" width="12" height="36" rx="6" fill="#092218" stroke="#39FF6A" stroke-width="2" />
  <rect x="164" y="85" width="12" height="36" rx="6" fill="#092218" stroke="#39FF6A" stroke-width="2" />

  <!-- Robot Head Curved Chassis -->
  <rect x="34" y="42" width="132" height="120" rx="36" fill="url(#rituuHead)" stroke="#39FF6A" stroke-width="2.5" />

  <!-- High-Tech Visor Screen -->
  <rect x="46" y="58" width="108" height="74" rx="22" fill="url(#rituuVisor)" stroke="#7FE7D6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Neon Green Eyes (Friendly Ovals - Idle) -->
  <ellipse cx="76" cy="92" rx="14" ry="18" fill="#39FF6A" filter="url(#eyeGlow)" />
  <ellipse cx="124" cy="92" rx="14" ry="18" fill="#39FF6A" filter="url(#eyeGlow)" />
  
  <!-- Pupil Highlights -->
  <circle cx="72" cy="86" r="4.5" fill="#FFFFFF" />
  <circle cx="120" cy="86" r="4.5" fill="#FFFFFF" />

  <!-- Cute Robotic Blush Lines (Teal) -->
  <line x1="56" y1="108" x2="66" y2="108" stroke="#7FE7D6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  <line x1="134" y1="108" x2="144" y2="108" stroke="#7FE7D6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Gentle Smile LED Waveform -->
  <path d="M 88 122 Q 100 130 112 122" fill="none" stroke="#39FF6A" stroke-width="3" stroke-linecap="round" filter="url(#eyeGlow)" />
</svg>
